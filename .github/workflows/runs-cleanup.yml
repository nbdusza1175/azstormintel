name: Runs cleanup
# Squashes the `runs` branch to a single commit each week so its history does not grow.
on:
  schedule:
    - cron: "17 11 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  squash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runs
          fetch-depth: 1
      - name: Prune old runs and squash
        run: |
          git config user.name "azstorm-bot"
          git config user.email "actions@users.noreply.github.com"
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/prune_runs.py" -o /tmp/prune_runs.py
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/config/limits.json" -o /tmp/limits.json
          LIMITS=/tmp/limits.json python /tmp/prune_runs.py runs
          old=$(git rev-parse HEAD)
          git checkout --orphan squashed
          git add -A
          git commit -qm "runs (squashed $(date -u +%F))"
          git push --force-with-lease=runs:$old origin squashed:runs
