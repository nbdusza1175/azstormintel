name: Upload CI test
# Temporary: runs scripts/run_request.py with uploaded-basin fixtures on the feature branch. Delete before merging.
on:
  push:
    branches: ["v3.5-upload"]
    paths: ["azstorm/**", "scripts/**", "config/**", "tests/fixtures/**", ".github/workflows/upload-ci-test.yml"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        case: [upload_mtdell_pourpoint, upload_fv_auto_outlet]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Run request
        continue-on-error: true
        run: |
          mkdir -p ci-logs/${{ matrix.case }}
          exec > >(tee ci-logs/${{ matrix.case }}/request_log.txt) 2>&1
          export CUSTOM_BASIN="$(cat tests/fixtures/${{ matrix.case }}.json)"
          for st in validate radar model finalize; do
            python scripts/run_request.py --run-id ci-${{ matrix.case }} --start-mst 2026-11-01T00:00 --end-mst 2026-11-02T00:00 --basins "" --stage $st || echo "stage $st exit $?"
          done
      - name: Commit logs
        if: always()
        run: |
          d=out/runs/ci-${{ matrix.case }}; o=ci-logs/${{ matrix.case }}
          cp $d/run.json $d/stages.json $o/ 2>/dev/null || true
          cp $d/model/run_log.txt $o/ 2>/dev/null || true
          python -c "import json;m=json.load(open('$d/meta.json'));print(json.dumps([{k:b[k] for k in ('id','name','outlet','notes','summary')} for b in m['basins']],indent=1,default=str))" > $o/meta_basins.json || true
          python -c "import json;d=json.load(open('$d/model/upload/summary.json'));print(json.dumps({k:d.get(k) for k in ['basin','sources','flags','storm','flood']},indent=1,default=str)[:9000])" > $o/model_summary.json || true
          git config user.name "azstorm-bot"; git config user.email "actions@users.noreply.github.com"
          git add ci-logs; git commit -qm "ci logs ${{ matrix.case }}" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q origin v3.5-upload && git push -q origin HEAD:v3.5-upload && break; sleep 5; done
