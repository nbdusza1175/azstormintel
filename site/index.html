<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AZ Storm Intel — Coconino County storm &amp; flood intensity</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="viz-root app">
  <header class="top">
    <div class="brand">
      <div class="title">AZ Storm Intel</div>
      <div class="sub">Coconino County storm &amp; flood intensity · radar-driven, gauges as checks</div>
    </div>
    <div class="evpick">
      <label for="event">Event</label>
      <select id="event"></select>
      <span id="evinfo" class="muted"></span>
    </div>
  </header>

  <aside class="side" id="side">
    <div class="loading" id="loading">Loading…</div>
  </aside>

  <section class="mapwrap">
    <div id="map"></div>
    <div class="mapctl">
      <div class="seg" role="group" aria-label="Radar layer">
        <button data-r="dbz" class="on">Radar dBZ</button>
        <button data-r="int">Rain rate</button>
        <button data-r="none">Off</button>
      </div>
      <label class="chk"><input type="checkbox" id="cellsOn" checked> Basin cells</label>
      <label class="chk">Opacity <input type="range" id="op" min="0.2" max="1" step="0.05" value="0.55"></label>
    </div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="timeline">
    <div class="tctl">
      <button id="prev" aria-label="Previous step">◀</button>
      <button id="play" aria-label="Play">▶</button>
      <button id="next" aria-label="Next step">▶|</button>
      <select id="speed" aria-label="Playback speed"><option value="250">4×/s</option><option value="100" selected>10×/s</option><option value="40">25×/s</option></select>
      <input type="range" id="slider" min="0" max="0" value="0" aria-label="Time">
      <span id="tlabel" class="tlabel"></span>
      <button id="jumpPeak" class="link">jump to peak</button>
    </div>
    <div class="chartwrap">
      <div class="chead"><span class="ctitle">Basin-average rain rate, 5-min (in/hr)</span><span class="clegend" id="clegend"></span>
        <button class="link" id="tableBtn">table</button></div>
      <svg id="chart" role="img" aria-label="Basin-average rain rate over the event"></svg>
      <div class="tip" id="tip" hidden></div>
    </div>
  </section>
</div>
<div class="modal" id="modal" hidden><div class="mbox"><button class="mclose" id="mclose" aria-label="Close">×</button><div id="mbody"></div></div></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
